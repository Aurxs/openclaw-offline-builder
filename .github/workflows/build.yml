name: Build OpenClaw Offline Package

on:
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: 'OpenClaw 版本 (留空使用 latest)'
        required: false
        default: 'latest'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              per_page: 100
            });
            const currentRunId = context.runId;
            const runsToDelete = data.workflow_runs.filter(run => run.id !== currentRunId);
            for (const run of runsToDelete) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build offline package
        run: bash build.sh
        env:
          OPENCLAW_VERSION: ${{ github.event.inputs.openclaw_version || 'latest' }}

      - name: Get version info
        id: version
        run: |
          mkdir -p /tmp/verify
          tar xzf openclaw-offline-arm64.tar.gz -C /tmp/verify
          VERSION=$(docker run --rm --platform linux/arm64 \
            -v /tmp/verify/openclaw-offline-arm64/payload:/p \
            ubuntu:20.04 bash -c "
              cp -a /p/node_modules_openclaw /tmp/oc 2>/dev/null
              cat /tmp/oc/package.json 2>/dev/null | grep '\"version\"' | head -1 | sed 's/.*: \"\(.*\)\".*/\1/'
            " 2>/dev/null || echo "unknown")
          echo "openclaw_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.date }}
          name: OpenClaw ${{ steps.version.outputs.openclaw_version }} (${{ steps.version.outputs.date }})
          body: |
            OpenClaw 离线安装包 (ARM64 Ubuntu 20.04)

            - OpenClaw: `${{ steps.version.outputs.openclaw_version }}`
            - Node.js: v24
            - 构建时间: ${{ github.event.repository.updated_at }}

            ### 使用方法
            ```bash
            tar xzf openclaw-offline-arm64.tar.gz
            cd openclaw-offline-arm64
            sudo bash install.sh
            ```
          files: openclaw-offline-arm64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const releasesToDelete = data.slice(1);
            for (const release of releasesToDelete) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              if (release.tag_name) {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
              }
            }
